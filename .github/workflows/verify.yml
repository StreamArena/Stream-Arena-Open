name: Verify runnable release
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[runtime,judge,providers,dev]"
      - run: python -m pip check
      - run: ruff check streameval models tests scripts
      - run: python scripts/verify_release.py
      - run: pytest -q
      - run: python -m build
